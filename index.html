<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    
    <title>JavaScript Background Color Switcher</title>

    <style>
    body {
    display: flex;
   justify-content: center;  /* horizontal center */
   align-items: center;      /* vertical center */
   height: 100vh;            /* full screen height */
  }

   .button {
    display: inline-block; /* inline-block = Best of both , Stay in same line and Can set width & height */
    width: 100px;
    height: 100px;
    margin: 10px;
    border: 2px solid black;
    cursor: pointer;
  }

  #pink { background-color: rgb(229, 94, 202); }
  #skyblue { background-color: rgb(132, 218, 249); }
  #green { background-color: rgb(124, 241, 65); }
  #gold { background-color: rgb(214, 174, 56); }
  
</style>

  </head>

  <body>
    
    <div class="canvas">
      
      <h1>Color Scheme Switcher</h1>
      <span class="button" id="pink"></span>
      <span class="button" id="skyblue"></span>
      <span class="button" id="green"></span>
      <span class="button" id="gold"></span>

      <h2>
        Try clicking on one of the colors above
        <span>to change the background color of this page!</span>
      </h2>
    </div>
    
    <script src="index.js"></script>
  </body>
</html>
